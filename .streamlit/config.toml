# Light theme with a light-green accent (matches the project identity).
# Streamlit reads this at server start — restart `streamlit run` after edits.
[theme]
base = "light"
primaryColor = "#1f8a4c"
backgroundColor = "#fbfcfb"
secondaryBackgroundColor = "#f4f8f5"
textColor = "#1c2620"
font = "sans serif"
