version: '3.8'

services:
  api:
    build: .
    container_name: swiss_forecaster_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: swiss_forecaster_ui
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000/predict
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: python -m src.api.app
    depends_on:
      - api
