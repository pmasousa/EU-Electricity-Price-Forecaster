[project]
name = "electricity-price-forecaster"
version = "0.2.0"
description = "A multi-country day-ahead electricity spot price forecasting model (Temporal Fusion Transformer)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "pandas",
    "numpy",
    "darts[torch]==0.45.0",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "openmeteo-requests",
    "requests-cache",
    "retry-requests",
    "matplotlib",
    "scikit-learn",
    "mlflow",
    "gradio",
    "numba>=0.58.0",
    "lightgbm"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]

[tool.ruff.lint.per-file-ignores]
# Script-style entry points set up sys.path before importing src.* — the
# resulting E402 is structural, not a smell.
"run_pipeline.py" = ["E402"]
"src/data/dataset.py" = ["E402"]
"src/data/download_entsoe.py" = ["E402"]
"src/data/download_weather.py" = ["E402"]
"src/features/build_features.py" = ["E402"]
"src/evaluation/backtest.py" = ["E402"]
"src/evaluation/reconcile_q50.py" = ["E402"]
